<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Zoo Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>Zoo Simulator</h1>
    </header>

    <main class="container">
        <p id="error" class="error" hidden></p>


        <div class="info-row">
            <div class="info-box">
                <span class="label">Date</span>
                <span id="zoo-date" class="value">-</span>
            </div>
            <div class="info-box">
                <span class="label">Time</span>
                <span id="zoo-time" class="value">-</span>
            </div>
            <div class="info-box">
                <span class="label">Animals alive</span>
                <span id="alive" class="value">-</span>
            </div>
            <button id="feed-button" class="feed-button" disabled>Feed animals</button>
        </div>

        <p id="hint" class="hint" hidden></p>
        <div id="species-sections"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
